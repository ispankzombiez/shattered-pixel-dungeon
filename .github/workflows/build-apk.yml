name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 17 is required by sdkmanager (cmdline-tools 16.0+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew android:assembleRelease

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/ci-signing.keystore \
            -storepass android \
            -alias ci-signing-key \
            -keypass android \
            -dname "CN=CI,O=Shattered Pixel Dungeon,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Sign release APK
        run: |
          UNSIGNED_APK=android/build/outputs/apk/release/android-release-unsigned.apk
          SIGNED_APK=android/build/outputs/apk/release/android-release-signed.apk
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks /tmp/ci-signing.keystore \
            --ks-key-alias ci-signing-key \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify "$SIGNED_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/build/outputs/apk/release/android-release-signed.apk

      - name: Get version name
        id: version
        if: github.ref_name == 'release'
        run: |
          VERSION=$(grep 'appVersionName' build.gradle | head -1 | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref_name == 'release'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Shattered Pixel Dungeon v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          files: android/build/outputs/apk/release/android-release-signed.apk
