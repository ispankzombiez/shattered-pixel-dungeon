name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 17 is required by sdkmanager (cmdline-tools 16.0+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew android:assembleDebug

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'appVersionName' build.gradle | head -1 | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Shattered Pixel Dungeon v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: android/build/outputs/apk/debug/android-debug.apk
