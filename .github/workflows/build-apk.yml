name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 17 is required by sdkmanager (cmdline-tools 16.0+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew android:assembleRelease

      - name: Prepare signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/ci-signing.keystore
            echo "::add-mask::$RELEASE_KEYSTORE_PASSWORD"
            echo "::add-mask::$RELEASE_KEY_PASSWORD"
            echo "SIGNING_KEYSTORE=/tmp/ci-signing.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASS=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASS=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            STORE_PASS="$(openssl rand -hex 16)"
            KEY_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$STORE_PASS"
            echo "::add-mask::$KEY_PASS"
            keytool -genkeypair -v \
              -keystore /tmp/ci-signing.keystore \
              -storepass "$STORE_PASS" \
              -alias ci-signing-key \
              -keypass "$KEY_PASS" \
              -dname "CN=CI,O=Shattered Pixel Dungeon,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            echo "SIGNING_KEYSTORE=/tmp/ci-signing.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=ci-signing-key" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          fi

      - name: Sign release APK
        run: |
          UNSIGNED_APK=android/build/outputs/apk/release/android-release-unsigned.apk
          SIGNED_APK=android/build/outputs/apk/release/android-release-signed.apk
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n1)"
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "Unable to find apksigner in PATH or \$ANDROID_HOME/build-tools" >&2
            exit 1
          fi
          "$APKSIGNER" sign \
            --ks "$SIGNING_KEYSTORE" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASS \
            --key-pass env:SIGNING_KEY_PASS \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"
          "$APKSIGNER" verify "$SIGNED_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/build/outputs/apk/release/android-release-signed.apk

      - name: Get version name
        id: version
        if: github.ref_name == 'release'
        run: |
          VERSION=$(grep 'appVersionName' build.gradle | head -1 | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref_name == 'release'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Shattered Pixel Dungeon v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          files: android/build/outputs/apk/release/android-release-signed.apk
