apply plugin: 'java-library'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

dependencies {
    api project(':SPD-classes')
    implementation project(':services')
}

tasks.register("sproutedSeedChecks", JavaExec) {
	group = "verification"
	description = "Runs deterministic Sprouted branch/layout seed regression checks."
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.shatteredpixel.shatteredpixeldungeon.levels.validation.SproutedSeedRegressionChecks"
}
